version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study-buddy-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_DEBUG=false
      - DATABASE_FILE=/data/study_buddy.db
      - GUNICORN_WORKERS=2
    env_file:
      - ./backend/.env
    volumes:
      - study_buddy_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  study_buddy_data:
    driver: local

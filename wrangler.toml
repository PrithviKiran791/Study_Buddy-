name = "study-buddy"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# To enable Cloudflare D1 persistence:
# 1. Run: npx wrangler d1 create study-buddy-db
# 2. Paste the generated database_id below and uncomment:
# [[d1_databases]]
# binding = "DB"
# database_name = "study-buddy-db"
# database_id = "your-database-id-uuid-here"

[vars]
DEFAULT_MODEL = "gemini"
GEMINI_MODEL = "gemini-1.5-flash"
FIREBASE_PROJECT_ID = "studyassistant-26fb6"
